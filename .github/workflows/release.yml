name: Build and publish npm package and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Set up npm for trusted publishing
        run: npm install --global npm@12.0.2
      - name: Install development dependencies
        run: npm ci
      - name: Build and test
        run: |
          npm run lint
          npm run build
          npm test
          npm run check:release -- --tag "$GITHUB_REF_NAME"
          git diff --exit-code -- lib
          npm audit --omit=dev
      - name: Package and verify a consumer installation
        run: npm run release
      - name: Publish the verified package to npm
        run: npm run publish:release
      - name: Publish the prebuilt archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./package.json').version")"
          release_assets=("release/sligqoer-dsh-usage-stats-${version}.tgz" "release/dsh-usage-stats.tgz" "release/SHA256SUMS")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            existing_dir="$RUNNER_TEMP/published-release"
            mkdir -p "$existing_dir"
            gh release download "$GITHUB_REF_NAME" --dir "$existing_dir" --pattern '*.tgz' --pattern SHA256SUMS
            for asset in "${release_assets[@]}"; do
              cmp "$asset" "$existing_dir/$(basename "$asset")"
            done
            echo 'Existing Release assets match; leaving them unchanged.'
          else
            release_args=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" \
              --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file release/RELEASE_NOTES.txt "${release_args[@]}"
          fi
